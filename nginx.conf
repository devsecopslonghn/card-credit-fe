server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /health { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  location /api/ {
    # Resolve the Kubernetes Service when an API request arrives so a transient
    # DNS race during pod startup cannot crash the static web server.
    resolver 10.96.0.10 valid=30s ipv6=off;
    set $backend_upstream http://card-credit-backend.card-credit.svc.cluster.local:3001;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / { try_files $uri $uri/ /index.html; }
}
